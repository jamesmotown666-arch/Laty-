<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Support Laty</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .name {
      font-family: Georgia, serif;
      font-size: 42px;
      font-weight: normal;
      margin-bottom: 45px;
    }

    .percentage {
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: #bdbdbd;
    }

    .progress-container {
      width: 100%;
      height: 7px;
      background: #292929;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 12%;
      background: #ffffff;
      border-radius: 20px;
      transition: width 0.5s ease;
    }

    .button {
      display: block;
      margin-top: 40px;

      width: 100%;
      padding: 17px;

      background: #ffffff;
      color: #0b0b0b;

      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;

      border-radius: 2px;
      transition: 0.2s;
    }

    .button:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .x {
      display: inline-block;
      margin-top: 25px;

      color: #777777;
      text-decoration: none;

      font-size: 12px;
    }

    .x:hover {
      color: #ffffff;
    }
  </style>
</head>

<body>

  <main class="box">

    <div class="name">
      Laty
    </div>

    <!-- ONLY YOU NEED TO CHANGE THIS -->
    <!-- Example: if you are at 12%, write 12% -->

    <div class="percentage">
      12%
    </div>

    <div class="progress-container">
      <div
        class="progress"
        style="width: 12%;">
      </div>
    </div>

    <!-- REPLACE WITH YOUR SELAR SHOW LOVE LINK -->

    <a
      class="button"
      href="YOUR_SELAR_LINK_HERE"
      target="_blank">
      Donate
    </a>

    <a
      class="x"
      href="https://x.com/laty_blog"
      target="_blank">
      @laty_blog
    </a>

  </main>

</body>
</html>
